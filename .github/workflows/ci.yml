name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rowtrace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan:secrets
      - run: npm run test:packed
      - run: npx playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: .tools/ms-playwright
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: .tools/ms-playwright
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
        env:
          ROWTRACE_COMMIT: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: node scripts/check-static-size.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/web/dist
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
